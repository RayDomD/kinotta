name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:docs
      - run: npm run check:commits -- "origin/$BASE_REF"
      # Unit suites shell out to ffmpeg/ffprobe, the renderer's Chromium and synth.py (numpy).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg python3-numpy
      - run: npx playwright install --with-deps chromium
      # Render and process-heavy suites need stable timing; they stay local.
      - run: npx vitest run --project unit
